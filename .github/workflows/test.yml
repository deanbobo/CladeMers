name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: AMD64
            blast_arch: x64-linux
          - runner: ubuntu-24.04-arm
            arch: ARM64
            blast_arch: aarch64-linux
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ make zlib1g-dev python3 gzip sqlite3 curl ca-certificates
      - name: Install BLAST+ integration tools
        env:
          BLAST_ARCH: ${{ matrix.blast_arch }}
        run: |
          blast_archive="ncbi-blast-2.17.0+-${BLAST_ARCH}.tar.gz"
          blast_url="https://ftp.ncbi.nlm.nih.gov/blast/executables/blast+/2.17.0"
          mkdir -p "$RUNNER_TEMP/clademers-blast"
          cd "$RUNNER_TEMP/clademers-blast"
          curl --fail --location --retry 3 "$blast_url/$blast_archive" --output "$blast_archive"
          curl --fail --location --retry 3 "$blast_url/$blast_archive.md5" --output "$blast_archive.md5"
          md5sum --check "$blast_archive.md5"
          tar -xzf "$blast_archive"
          blast_bin="$RUNNER_TEMP/clademers-blast/ncbi-blast-2.17.0+/bin"
          "$blast_bin/blastdbcmd" -version
          "$blast_bin/makeblastdb" -version
          echo "BLAST_BIN=$blast_bin" >> "$GITHUB_ENV"
      - name: Build
        run: |
          make clean
          make CXX=g++
          ./clademers --version
      - name: Test
        run: make test-blast BLAST_BIN="$BLAST_BIN"
      - name: Check clean and rebuild
        run: |
          make clean
          make clean
          test ! -e clademers
          make CXX=g++
